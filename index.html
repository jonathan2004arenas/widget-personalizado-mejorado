<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

</head>


<body>

    <div id="contenedorWidget">

        <input
            type="text"
            id="idBusqueda"
            placeholder="Ingrese el ID"
        >

        <button
            type="button"
            id="btnBuscar"
        >
            Buscar
        </button>

        <div id="mensaje"></div>

    </div>


    <script>

        /* =====================================================
           CONFIGURACIÓN
        ===================================================== */

        let API_URL = "";
        let HOJA = "";
        let COLUMNA_ID = "";

        let AUTOFILL_CONDITION = false;
        let BACKGROUND = false;


        /* =====================================================
           CONTROL DE BÚSQUEDAS AUTOMÁTICAS
        ===================================================== */

        /*
        Guarda el último ID que fue procesado
        por Autofill By Condition.
        */

        let ultimoIDProcesado = "";


        /*
        Guarda el ID que actualmente se está buscando.
        */

        let idBusquedaActual = "";


        /*
        Controla las búsquedas que están ejecutándose.
        */

        let busquedaEnCurso = false;


        /*
        Permite cancelar una petición fetch anterior.
        */

        let controladorBusqueda = null;


        /*
        Número de búsqueda.
        Sirve para detectar respuestas antiguas.
        */

        let numeroBusqueda = 0;


        /* =====================================================
           ELEMENTOS HTML
        ===================================================== */

        const contenedorWidget =
            document.getElementById(
                "contenedorWidget"
            );


        const campoID =
            document.getElementById(
                "idBusqueda"
            );


        const botonBuscar =
            document.getElementById(
                "btnBuscar"
            );


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        let datosEncontrados = null;


        /* =====================================================
           CONVERTIR SI / NO A BOOLEAN
        ===================================================== */

        function convertirBooleano(valor) {

            console.log(
                "🔍 Valor recibido para convertir a booleano:",
                valor,
                "Tipo:",
                typeof valor
            );


            /*
            Si Jotform devuelve un objeto,
            intentamos obtener su valor.
            */

            if (
                valor !== null &&
                typeof valor === "object"
            ) {

                valor =
                    valor.value ??
                    valor.label ??
                    "";

            }


            const texto =
                String(valor)
                    .trim()
                    .toUpperCase();


            console.log(
                "🔄 Valor normalizado:",
                texto
            );


            if (
                texto === "SI" ||
                texto === "SÍ" ||
                texto === "TRUE" ||
                texto === "YES" ||
                texto === "1"
            ) {

                return true;

            }


            return false;

        }


        /* =====================================================
           VALIDAR CONFIGURACIÓN
        ===================================================== */

        function validarConfiguracion() {

            let configurado = true;


            if (!API_URL) {

                console.error(
                    "❌ Falta configurar la URL de la API"
                );

                configurado = false;

            }


            if (!HOJA) {

                console.error(
                    "❌ Falta configurar el nombre de la hoja"
                );

                configurado = false;

            }


            if (!COLUMNA_ID) {

                console.error(
                    "❌ Falta configurar el nombre de la columna ID"
                );

                configurado = false;

            }


            return configurado;

        }


        /* =====================================================
           EXTRAER ID DE POPULATE
        ===================================================== */

        function obtenerIDDePopulate(valor) {

            if (
                valor === undefined ||
                valor === null
            ) {

                return "";

            }


            let valorExtraido = "";


            /*
            Caso normal:
            { type: "widgetpopulate", value: "EQ-1" }
            */

            if (
                typeof valor === "object"
            ) {

                valorExtraido =
                    valor.value ??
                    valor.label ??
                    "";

            }
            else {

                valorExtraido = valor;

            }


            /*
            Si nuevamente viene como objeto,
            intentamos extraer su value.
            */

            if (
                valorExtraido !== null &&
                typeof valorExtraido === "object"
            ) {

                valorExtraido =
                    valorExtraido.value ??
                    valorExtraido.label ??
                    "";

            }


            return String(
                valorExtraido || ""
            ).trim();

        }


        /* =====================================================
           CANCELAR BÚSQUEDA ANTERIOR
        ===================================================== */

        function cancelarBusquedaAnterior() {

            if (
                controladorBusqueda
            ) {

                console.log(
                    "🛑 Cancelando búsqueda anterior"
                );


                controladorBusqueda.abort();


                controladorBusqueda = null;

            }


            busquedaEnCurso = false;

        }


        /* =====================================================
           BUSCAR REGISTRO
        ===================================================== */

        async function buscarRegistro(
            idForzado = null,
            esBusquedaAutomatica = false
        ) {

            console.log(
                "🔎 Iniciando búsqueda"
            );


            if (!validarConfiguracion()) {

                mensaje.textContent =
                    "⚠️ El widget aún no está configurado correctamente";

                return;

            }


            /*
            Obtener ID.

            Si viene desde populate usamos idForzado.
            Si es búsqueda manual usamos el input.
            */

            const id =
                idForzado !== null
                    ? String(idForzado).trim()
                    : campoID.value.trim();


            if (!id) {

                mensaje.textContent =
                    "Ingrese un ID";

                return;

            }


            /* =================================================
               CONTROL DE BÚSQUEDA AUTOMÁTICA
            ================================================= */

            if (
                esBusquedaAutomatica
            ) {

                /*
                Si Jotform manda exactamente
                el mismo ID que ya procesamos,
                NO hacemos otra búsqueda.
                */

                if (
                    ultimoIDProcesado === id
                ) {

                    console.log(
                        "⏭️ ID ya procesado. No se realizará otra búsqueda:",
                        id
                    );

                    return;

                }


                /*
                Si ya hay una búsqueda para otro ID,
                la cancelamos.
                */

                if (
                    busquedaEnCurso &&
                    idBusquedaActual !== id
                ) {

                    console.log(
                        "🔄 Cambió el ID:",
                        idBusquedaActual,
                        "→",
                        id
                    );


                    cancelarBusquedaAnterior();

                }


                /*
                Si exactamente este ID ya está
                siendo buscado, no duplicamos la petición.
                */

                if (
                    busquedaEnCurso &&
                    idBusquedaActual === id
                ) {

                    console.log(
                        "⏭️ Esta búsqueda ya está en curso:",
                        id
                    );

                    return;

                }

            }


            /* =================================================
               PREPARAR NUEVA BÚSQUEDA
            ================================================= */

            busquedaEnCurso = true;

            idBusquedaActual = id;

            numeroBusqueda++;

            const numeroBusquedaActual =
                numeroBusqueda;


            /*
            Creamos un nuevo AbortController.
            */

            controladorBusqueda =
                new AbortController();


            const signal =
                controladorBusqueda.signal;


            mensaje.textContent =
                "⏳ Buscando...";


            try {

                const url =
                    API_URL +
                    "?hoja=" +
                    encodeURIComponent(HOJA) +
                    "&columnaID=" +
                    encodeURIComponent(COLUMNA_ID) +
                    "&id=" +
                    encodeURIComponent(id);


                console.log(
                    "🌐 Consultando:",
                    url
                );


                const respuesta =
                    await fetch(
                        url,
                        {
                            signal: signal
                        }
                    );


                const resultado =
                    await respuesta.json();


                console.log(
                    "📦 Respuesta API:",
                    resultado
                );


                /* =================================================
                   VERIFICAR SI ESTA RESPUESTA SIGUE SIENDO VÁLIDA
                ================================================= */

                /*
                Si mientras esperábamos llegó otro ID,
                esta respuesta ya no debe modificar Jotform.
                */

                if (
                    numeroBusquedaActual !== numeroBusqueda
                ) {

                    console.log(
                        "⚠️ Respuesta antigua ignorada:",
                        id
                    );

                    return;

                }


                if (
                    id !== campoID.value.trim()
                ) {

                    console.log(
                        "⚠️ El ID cambió mientras se realizaba la búsqueda.",
                        "Respuesta ignorada:",
                        id
                    );

                    return;

                }


                /* =================================================
                   REGISTRO NO ENCONTRADO
                ================================================= */

                if (
                    !resultado.encontrado
                ) {

                    mensaje.textContent =
                        "❌ Registro no encontrado";


                    datosEncontrados =
                        null;


                    /*
                    Marcamos este ID como procesado
                    incluso si no fue encontrado.

                    Así Jotform no intentará buscarlo
                    infinitamente.
                    */

                    if (
                        esBusquedaAutomatica
                    ) {

                        ultimoIDProcesado =
                            id;

                    }


                    return;

                }


                /* =================================================
                   REGISTRO ENCONTRADO
                ================================================= */

                datosEncontrados =
                    resultado.datos;


                mensaje.textContent =
                    "✅ Registro encontrado";


                console.log(
                    "📋 Datos encontrados:",
                    datosEncontrados
                );


                /* =================================================
                   MARCAR ID COMO PROCESADO
                ================================================= */

                if (
                    esBusquedaAutomatica
                ) {

                    ultimoIDProcesado =
                        id;


                    console.log(
                        "✅ ID marcado como procesado:",
                        ultimoIDProcesado
                    );

                }


                /* =================================================
                   CREAR CAMPOS PARA JOTFORM
                ================================================= */

                const camposJotform = [];


                Object.entries(
                    datosEncontrados
                ).forEach(

                    function(
                        [nombreCampo, valor]
                    ) {

                        camposJotform.push({

                            label:
                                nombreCampo,

                            value:
                                valor || ""

                        });

                    }

                );


                console.log(
                    "📤 Campos para Jotform:",
                    camposJotform
                );


                /* =================================================
                   ENVIAR DATOS A JOTFORM
                ================================================= */

                if (
                    typeof JFCustomWidget !==
                    "undefined"
                ) {

                    JFCustomWidget.setFieldsValueByLabel(
                        camposJotform
                    );


                    JFCustomWidget.sendData({

                        valid: true,

                        value: id

                    });


                    console.log(
                        "✅ Datos enviados a Jotform"
                    );

                }


            }
            catch (error) {

                /*
                AbortError significa que nosotros
                cancelamos la búsqueda porque llegó
                un ID nuevo.

                No lo mostramos como error.
                */

                if (
                    error.name === "AbortError"
                ) {

                    console.log(
                        "🛑 Búsqueda cancelada:",
                        id
                    );

                    return;

                }


                console.error(
                    "❌ Error completo:",
                    error
                );


                mensaje.textContent =
                    "❌ Error consultando la base de datos";

            }
            finally {

                /*
                Solo limpiamos el estado si esta
                sigue siendo la búsqueda actual.
                */

                if (
                    numeroBusquedaActual === numeroBusqueda
                ) {

                    busquedaEnCurso = false;

                    controladorBusqueda =
                        null;

                    idBusquedaActual =
                        "";

                }

            }

        }


        /* =====================================================
           EVENTO BOTÓN BUSCAR
        ===================================================== */

        botonBuscar.addEventListener(

            "click",

            function() {

                /*
                La búsqueda manual NO usa
                la protección de Autofill.
                */

                buscarRegistro(
                    null,
                    false
                );

            }

        );


        /* =====================================================
           EVENTO ENTER
        ===================================================== */

        campoID.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();


                    buscarRegistro(
                        null,
                        false
                    );

                }

            }

        );


        /* =====================================================
           EVENTO BLUR
        ===================================================== */

        campoID.addEventListener(

            "blur",

            function() {

                /*
                Si Autofill está activado,
                NO buscamos mediante blur.

                La búsqueda será controlada
                exclusivamente por POPULATE.
                */

                if (
                    AUTOFILL_CONDITION
                ) {

                    return;

                }


                if (
                    campoID.value.trim() !== ""
                ) {

                    buscarRegistro(
                        null,
                        false
                    );

                }

            }

        );


        /* =====================================================
           CONEXIÓN CON JOTFORM
        ===================================================== */

        if (
            typeof JFCustomWidget !==
            "undefined"
        ) {


            /* =================================================
               READY
            ================================================= */

            JFCustomWidget.subscribe(

                "ready",

                function() {

                    console.log(
                        "🟢 Widget genérico conectado con Jotform"
                    );


                    /* ==========================================
                       LEER CONFIGURACIÓN
                    ========================================== */

                    API_URL =
                        JFCustomWidget.getWidgetSetting(
                            "apiUrl"
                        ) || "";


                    HOJA =
                        JFCustomWidget.getWidgetSetting(
                            "hoja"
                        ) || "";


                    COLUMNA_ID =
                        JFCustomWidget.getWidgetSetting(
                            "columnaId"
                        ) || "";


                    const valorAutofill =
                        JFCustomWidget.getWidgetSetting(
                            "autofillCondition"
                        );


                    const valorBackground =
                        JFCustomWidget.getWidgetSetting(
                            "background"
                        );


                    console.log(
                        "📥 VALOR RAW AUTOFILL:",
                        valorAutofill
                    );


                    console.log(
                        "📥 VALOR RAW BACKGROUND:",
                        valorBackground
                    );


                    /* ==========================================
                       CONVERTIR BOOLEAN
                    ========================================== */

                    AUTOFILL_CONDITION =
                        convertirBooleano(
                            valorAutofill
                        );


                    BACKGROUND =
                        convertirBooleano(
                            valorBackground
                        );


                    console.log(
                        "🔄 AUTOFILL_CONDITION:",
                        AUTOFILL_CONDITION
                    );


                    console.log(
                        "👻 BACKGROUND:",
                        BACKGROUND
                    );


                    /* ==========================================
                       CONFIGURACIÓN
                    ========================================== */

                    console.log(
                        "⚙️ CONFIGURACIÓN DEL WIDGET"
                    );


                    console.log(
                        "🌐 API_URL:",
                        API_URL
                    );


                    console.log(
                        "📄 HOJA:",
                        HOJA
                    );


                    console.log(
                        "🔑 COLUMNA_ID:",
                        COLUMNA_ID
                    );


                    console.log(
                        "🔄 AUTOFILL_CONDITION:",
                        AUTOFILL_CONDITION
                    );


                    console.log(
                        "👻 BACKGROUND:",
                        BACKGROUND
                    );


                    /* ==========================================
                       VALIDAR CONFIGURACIÓN
                    ========================================== */

                    if (
                        validarConfiguracion()
                    ) {

                        console.log(
                            "✅ Widget configurado correctamente"
                        );

                    }


                    /* ==========================================
                       BACKGROUND
                    ========================================== */

                    if (
                        BACKGROUND &&
                        AUTOFILL_CONDITION
                    ) {

                        console.log(
                            "👻 Widget ejecutándose en segundo plano"
                        );

                        /*
                            Ocultamos el contenedor completo
                            del widget dentro de Jotform.

                            Esto es diferente de ocultar solamente
                            nuestro HTML interno.
                            */

                            if (
                                typeof JFCustomWidget.hideWidgetContainer ===
                                "function"
                            ) {

                                console.log(
                                    "🙈 Ocultando contenedor completo del widget"
                                );


                                JFCustomWidget.hideWidgetContainer();

                            }
                            else {

                                /*
                                Fallback por si Jotform no expone
                                este método en alguna versión.
                                */

                                console.warn(
                                    "⚠️ hideWidgetContainer no está disponible"
                                );


                                contenedorWidget.style.display =
                                    "none";


                                /*
                                Intentamos reducir también
                                el tamaño del iframe.
                                */

                                if (
                                    typeof JFCustomWidget.requestFrameResize ===
                                    "function"
                                ) {

                                    JFCustomWidget.requestFrameResize({

                                        height: 0

                                    });

                                }

                            }

                        }
                        else {

                            console.log(
                                "👁️ Widget visible"
                            );

                        }

                    }

            );


            /* =================================================
               POPULATE
            ================================================= */

            JFCustomWidget.subscribe(

                "populate",

                function(valor) {

                    console.log(
                        "📥 Evento POPULATE recibido:",
                        valor
                    );


                    /*
                    Obtener correctamente el ID.
                    */

                    const nuevoID =
                        obtenerIDDePopulate(
                            valor
                        );


                    console.log(
                        "🔄 Nuevo ID recibido:",
                        nuevoID
                    );


                    if (!nuevoID) {

                        console.log(
                            "⚠️ POPULATE recibido sin ID"
                        );

                        return;

                    }


                    /* ==========================================
                       ACTUALIZAR INPUT
                    ========================================== */

                    campoID.value =
                        nuevoID;


                    /* ==========================================
                       AUTOFILL BY CONDITION
                    ========================================== */

                    if (
                        AUTOFILL_CONDITION
                    ) {

                        console.log(
                            "🔄 Autofill by condition activado"
                        );


                        /*
                        La función se encarga de:

                        - evitar duplicados
                        - cancelar búsquedas anteriores
                        - ignorar respuestas antiguas
                        - buscar solamente una vez
                        */

                        buscarRegistro(
                            nuevoID,
                            true
                        );

                    }


                }

            );


            /* =================================================
               SUBMIT
            ================================================= */

            JFCustomWidget.subscribe(

                "submit",

                function() {

                    JFCustomWidget.sendSubmit({

                        valid: true,

                        value:
                            JSON.stringify(
                                datosEncontrados || {}
                            )

                    });

                }

            );

        }

    </script>

</body>

</html>
