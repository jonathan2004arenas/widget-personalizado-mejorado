<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

</head>


<body>

    <div id="contenedorWidget">

        <input
            type="text"
            id="idBusqueda"
            placeholder="Ingrese el ID"
        >

        <button
            type="button"
            id="btnBuscar"
        >
            Buscar
        </button>

        <div id="mensaje"></div>

    </div>


    <script>

        /* =====================================================
           CONFIGURACIÓN
        ===================================================== */

        let API_URL = "";
        let HOJA = "";
        let COLUMNA_ID = "";

        let AUTOFILL_CONDITION = false;
        let BACKGROUND = false;


        /* =====================================================
           ELEMENTOS HTML
        ===================================================== */

        const contenedorWidget =
            document.getElementById(
                "contenedorWidget"
            );


        const campoID =
            document.getElementById(
                "idBusqueda"
            );


        const botonBuscar =
            document.getElementById(
                "btnBuscar"
            );


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        let datosEncontrados = null;


        /* =====================================================
           FUNCIÓN PARA CONVERTIR CHECKBOX A BOOLEAN
        ===================================================== */

        function convertirBooleano(valor) {

            console.log(
                "🔍 Valor recibido para convertir a booleano:",
                valor,
                "Tipo:",
                typeof valor
            );

            /*
            Si Jotform devuelve un objeto,
            intentamos obtener su valor.
            */

            if (
                valor !== null &&
                typeof valor === "object"
            ) {

                valor =
                    valor.value ??
                    valor.label ??
                    "";

            }


            /*
            Convertimos a texto
            */

            const texto =
                String(valor)
                    .trim()
                    .toUpperCase();


            console.log(
                "🔄 Valor normalizado:",
                texto
            );


            /*
            SI = true
            NO = false
            */

            if (
                texto === "SI" ||
                texto === "SÍ" ||
                texto === "TRUE" ||
                texto === "YES" ||
                texto === "1"
            ) {

                return true;

            }


            return false;

        }


        /* =====================================================
           VALIDAR CONFIGURACIÓN
        ===================================================== */

        function validarConfiguracion() {

            let configurado = true;


            if (!API_URL) {

                console.error(
                    "❌ Falta configurar la URL de la API"
                );

                configurado = false;

            }


            if (!HOJA) {

                console.error(
                    "❌ Falta configurar el nombre de la hoja"
                );

                configurado = false;

            }


            if (!COLUMNA_ID) {

                console.error(
                    "❌ Falta configurar el nombre de la columna ID"
                );

                configurado = false;

            }


            return configurado;

        }


        /* =====================================================
           BUSCAR REGISTRO
        ===================================================== */

        async function buscarRegistro() {

            console.log(
                "🔎 Iniciando búsqueda"
            );


            if (!validarConfiguracion()) {

                mensaje.textContent =
                    "⚠️ El widget aún no está configurado correctamente";

                return;

            }


            const id =
                campoID.value.trim();


            if (!id) {

                mensaje.textContent =
                    "Ingrese un ID";

                return;

            }


            mensaje.textContent =
                "⏳ Buscando...";


            try {

                const url =
                    API_URL +
                    "?hoja=" +
                    encodeURIComponent(HOJA) +
                    "&columnaID=" +
                    encodeURIComponent(COLUMNA_ID) +
                    "&id=" +
                    encodeURIComponent(id);


                console.log(
                    "🌐 Consultando:",
                    url
                );


                const respuesta =
                    await fetch(url);


                const resultado =
                    await respuesta.json();


                console.log(
                    "📦 Respuesta API:",
                    resultado
                );


                /* =============================================
                   REGISTRO NO ENCONTRADO
                ============================================= */

                if (!resultado.encontrado) {

                    mensaje.textContent =
                        "❌ Registro no encontrado";


                    datosEncontrados =
                        null;


                    return;

                }


                /* =============================================
                   REGISTRO ENCONTRADO
                ============================================= */

                datosEncontrados =
                    resultado.datos;


                mensaje.textContent =
                    "✅ Registro encontrado";


                console.log(
                    "📋 Datos encontrados:",
                    datosEncontrados
                );


                /* =============================================
                   CREAR CAMPOS PARA JOTFORM
                ============================================= */

                const camposJotform = [];


                Object.entries(
                    datosEncontrados
                ).forEach(

                    function(
                        [nombreCampo, valor]
                    ) {

                        camposJotform.push({

                            label:
                                nombreCampo,

                            value:
                                valor || ""

                        });

                    }

                );


                console.log(
                    "📤 Campos para Jotform:",
                    camposJotform
                );


                /* =============================================
                   ENVIAR DATOS A JOTFORM
                ============================================= */

                if (
                    typeof JFCustomWidget !==
                    "undefined"
                ) {

                    JFCustomWidget.setFieldsValueByLabel(
                        camposJotform
                    );


                    JFCustomWidget.sendData({

                        valid: true,

                        value: id

                    });


                    console.log(
                        "✅ Datos enviados a Jotform"
                    );

                }


            } catch (error) {

                console.error(
                    "❌ Error completo:",
                    error
                );


                mensaje.textContent =
                    "❌ Error consultando la base de datos";

            }

        }


        /* =====================================================
           EVENTO BOTÓN BUSCAR
        ===================================================== */

        botonBuscar.addEventListener(

            "click",

            function() {

                buscarRegistro();

            }

        );


        /* =====================================================
           EVENTO ENTER
        ===================================================== */

        campoID.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    buscarRegistro();

                }

            }

        );


        /* =====================================================
           EVENTO BLUR
        ===================================================== */

        campoID.addEventListener(

            "blur",

            function() {

                /*
                Solo buscamos automáticamente
                si NO está activo Autofill by condition.
                */

                if (
                    !AUTOFILL_CONDITION &&
                    campoID.value.trim() !== ""
                ) {

                    buscarRegistro();

                }

            }

        );


        /* =====================================================
           CONEXIÓN CON JOTFORM
        ===================================================== */

        if (
            typeof JFCustomWidget !==
            "undefined"
        ) {


            /* =================================================
               READY
            ================================================= */

            JFCustomWidget.subscribe(

                "ready",

                function() {

                    console.log(
                        "🟢 Widget genérico conectado con Jotform"
                    );


                    /* ==========================================
                       LEER CONFIGURACIÓN INDIVIDUAL
                    ========================================== */

                    API_URL =
                        JFCustomWidget.getWidgetSetting(
                            "apiUrl"
                        ) || "";


                    HOJA =
                        JFCustomWidget.getWidgetSetting(
                            "hoja"
                        ) || "";


                    COLUMNA_ID =
                        JFCustomWidget.getWidgetSetting(
                            "columnaId"
                        ) || "";


                    AUTOFILL_CONDITION =
                        convertirBooleano(

                            JFCustomWidget.getWidgetSetting(
                                "autofillCondition"
                            )

                        );


                    BACKGROUND =
                        convertirBooleano(

                            JFCustomWidget.getWidgetSetting(
                                "background"
                            )

                        );


                    /* ==========================================
                       LOG DE CONFIGURACIÓN
                    ========================================== */

                    console.log(
                        "⚙️ CONFIGURACIÓN DEL WIDGET"
                    );


                    console.log(
                        "🌐 API_URL:",
                        API_URL
                    );


                    console.log(
                        "📄 HOJA:",
                        HOJA
                    );


                    console.log(
                        "🔑 COLUMNA_ID:",
                        COLUMNA_ID
                    );


                    console.log(
                        "🔄 AUTOFILL_CONDITION:",
                        AUTOFILL_CONDITION
                    );


                    console.log(
                        "👻 BACKGROUND:",
                        BACKGROUND
                    );


                    /* ==========================================
                       VALIDAR CONFIGURACIÓN
                    ========================================== */

                    if (
                        validarConfiguracion()
                    ) {

                        console.log(
                            "✅ Widget configurado correctamente"
                        );

                    }


                    /* ==========================================
                       MODO BACKGROUND
                    ========================================== */

                    if (BACKGROUND) {

                        console.log(
                            "👻 Widget ejecutándose en segundo plano"
                        );


                        contenedorWidget.style.display =
                            "none";

                    }

                }

            );


            /* =================================================
               POPULATE
               RECIBIR VALOR DESDE JOTFORM
            ================================================= */

            JFCustomWidget.subscribe(

                "populate",

                function(valor) {

                    console.log(
                        "📥 Evento POPULATE recibido:",
                        valor
                    );


                    if (
                        valor === undefined ||
                        valor === null
                    ) {

                        console.log(
                            "⚠️ POPULATE recibido sin valor"
                        );

                        return;

                    }


                    /*
                    Obtener el valor correctamente.
                    Jotform normalmente envía un objeto.
                    */

                    const nuevoID =
                        String(
                            valor.value || ""
                        ).trim();


                    console.log(
                        "🔄 Nuevo ID recibido:",
                        nuevoID
                    );


                    if (!nuevoID) {

                        return;

                    }


                    /* ==========================================
                       COLOCAR ID EN EL INPUT
                    ========================================== */

                    campoID.value =
                        nuevoID;


                    /* ==========================================
                       ACTUALIZAR VALOR DEL WIDGET
                    ========================================== */

                    JFCustomWidget.sendData({

                        valid: true,

                        value: nuevoID

                    });


                    /* ==========================================
                       AUTOFILL BY CONDITION
                    ========================================== */

                    if (
                        AUTOFILL_CONDITION
                    ) {

                        console.log(
                            "🔄 Autofill by condition activado"
                        );


                        buscarRegistro();

                    }

                }

            );


            /* =================================================
               SUBMIT
            ================================================= */

            JFCustomWidget.subscribe(

                "submit",

                function() {

                    JFCustomWidget.sendSubmit({

                        valid: true,

                        value:
                            JSON.stringify(
                                datosEncontrados || {}
                            )

                    });

                }

            );

        }

    </script>

</body>

</html>
